<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#131527">
<title>FIQ Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#131527}
body{min-height:100vh;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}.card{background:#1e223d;border:1px solid #2d3358;border-radius:16px;padding:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.4)}
h1{font-size:20px;margin:0 0 5px;color:#fff}p{font-size:12px;color:#94a3b8;margin:0 0 14px;line-height:1.5}
#reader{width:100%;min-height:80px;overflow:hidden;border-radius:12px;background:#0b0d18}
#reader video{width:100%!important;max-height:68vh;object-fit:cover;border-radius:12px}
.status{margin-top:12px;padding:11px 12px;border-radius:10px;background:#131527;border:1px solid #2d3358;font-size:12px;color:#cbd5e1;text-align:center;line-height:1.45}
.ok{border-color:rgba(34,197,94,.45);color:#86efac}.error{border-color:rgba(239,68,68,.45);color:#fca5a5}.warn{border-color:rgba(245,158,11,.45);color:#fcd34d}
button{width:100%;margin-top:10px;padding:12px 14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
button.secondary{background:#334155}button:disabled{opacity:.55;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.small{font-size:11px;margin-top:10px;color:#64748b;text-align:center}.hidden{display:none!important}
.result{margin-top:12px;padding:13px;border-radius:10px;background:#052e16;border:1px solid rgba(34,197,94,.4);color:#bbf7d0;font-weight:800;text-align:center;word-break:break-all}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>FIQ Barcode Scanner</h1>
<p>Arahkan kamera belakang HP ke barcode nomor frame. Hasil scan akan dikirim otomatis kembali ke Form Checksheet.</p>
<div id="reader"></div>
<div id="status" class="status">Tekan <b>Mulai Kamera</b> untuk memberikan izin kamera.</div>
<div class="row">
<button id="startBtn" type="button" onclick="startScanner()">📷 Mulai Kamera</button>
<button id="stopBtn" type="button" class="secondary" onclick="closeScanner()">✕ Tutup</button>
</div>
<div id="result" class="result hidden"></div>
<div class="small">Wajib HTTPS. Jika browser meminta izin kamera, pilih <b>Izinkan / Allow</b>.</div>
</div></div>

<script>
let scanner=null, running=false, finished=false;

function setStatus(message,type){
  const el=document.getElementById('status');
  el.innerHTML=message;
  el.className='status'+(type?' '+type:'');
}
function chooseBackCamera(cameras){
  if(!cameras||!cameras.length)return null;
  const keys=['back','rear','environment','belakang','camera2 0','camera 0','facing back'];
  return cameras.find(c=>keys.some(k=>String(c.label||'').toLowerCase().includes(k))) || cameras[cameras.length-1] || cameras[0];
}
async function startScanner(){
  if(running)return;
  if(!window.isSecureContext||location.protocol!=='https:'){
    setStatus('Scanner harus dibuka melalui HTTPS (GitHub Pages).','error');return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('Browser tidak menyediakan akses kamera. Gunakan Chrome/Edge/Safari terbaru.','error');return;
  }
  if(typeof Html5Qrcode==='undefined'){
    setStatus('Library scanner gagal dimuat. Periksa koneksi internet lalu refresh.','error');return;
  }

  finished=false;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('startBtn').disabled=true;
  setStatus('Meminta izin kamera...','warn');

  try{
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error('Tidak ada kamera yang terdeteksi.');
    const back=chooseBackCamera(cameras);
    scanner=new Html5Qrcode('reader');

    const config={
      fps:12,
      qrbox:function(w,h){
        const width=Math.max(220,Math.min(Math.floor(w*.86),420));
        const height=Math.max(100,Math.min(Math.floor(h*.36),190));
        return {width:width,height:height};
      },
      aspectRatio:1.7777778,
      disableFlip:false
    };
    const success=t=>handleScanResult(t);
    const failure=()=>{};

    try{
      await scanner.start({deviceId:{exact:back.id}},config,success,failure);
    }catch(e1){
      console.warn('deviceId fallback:',e1);
      await stopScannerOnly();
      scanner=new Html5Qrcode('reader');
      await scanner.start({facingMode:'environment'},config,success,failure);
    }

    running=true;
    setStatus('KAMERA AKTIF — Arahkan kotak scan ke barcode nomor frame.','ok');
    document.getElementById('startBtn').textContent='📷 Kamera Aktif';
  }catch(err){
    console.error(err);
    running=false;
    document.getElementById('startBtn').disabled=false;
    document.getElementById('startBtn').textContent='📷 Mulai Kamera';
    let msg=err&&err.message?err.message:String(err);
    if(err&&err.name==='NotAllowedError')msg='Izin kamera ditolak. Tekan ikon 🔒 di address bar → Site settings/Permissions → Camera → Allow, lalu refresh.';
    else if(err&&err.name==='NotFoundError')msg='Kamera tidak ditemukan pada perangkat.';
    else if(err&&err.name==='NotReadableError')msg='Kamera sedang dipakai aplikasi lain. Tutup Kamera/WhatsApp/Meet lalu coba lagi.';
    else if(err&&err.name==='OverconstrainedError')msg='Kamera belakang tidak cocok. Refresh halaman lalu coba lagi.';
    setStatus('Gagal membuka kamera:<br>'+escapeHtml(msg),'error');
  }
}
async function handleScanResult(value){
  if(finished)return;
  const result=String(value||'').trim();
  if(!result)return;
  finished=true;
  document.getElementById('result').textContent=result;
  document.getElementById('result').classList.remove('hidden');
  setStatus('Barcode terbaca. Mengirim hasil ke aplikasi...','ok');
  await stopScannerOnly();

  let sent=false;
  try{
    if(window.opener&&!window.opener.closed){
      window.opener.postMessage({type:'FIQ_BARCODE_SCANNED',value:result},'*');
      sent=true;
    }
  }catch(e){console.error(e)}

  if(sent){
    setStatus('Berhasil dikirim ke Form Checksheet. Menutup scanner...','ok');
    setTimeout(()=>{try{window.close()}catch(e){}},500);
  }else{
    setStatus('Barcode terbaca, tetapi tab aplikasi asal tidak ditemukan. Buka scanner dari tombol Scan di aplikasi FIQ.','warn');
  }
}
async function stopScannerOnly(){
  if(!scanner){running=false;return}
  try{if(running||scanner.isScanning)await scanner.stop()}catch(e){console.warn(e)}
  try{scanner.clear()}catch(e){}
  scanner=null;running=false;
  document.getElementById('startBtn').disabled=false;
  document.getElementById('startBtn').textContent='📷 Mulai Kamera';
}
async function closeScanner(){
  await stopScannerOnly();
  try{window.close()}catch(e){}
  setStatus('Scanner ditutup.','');
}
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
window.addEventListener('pagehide',()=>stopScannerOnly());
</script>
</body>
</html>
